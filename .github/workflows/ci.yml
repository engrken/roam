name: ROAM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: roam-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --package-lock=false --prefer-offline --no-audit --no-fund
      - name: Validate Prisma schema and generate client
        run: npx prisma validate && npm run db:generate
        env:
          ROAMDB_POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/roam
          ROAMDB_DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/roam
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          ROAMDB_POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/roam
          ROAMDB_DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/roam
          AUTH_SECRET: ci-only-secret-not-for-deployment
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          SMTP_USER: ci
          SMTP_APP_PASSWORD: ci
